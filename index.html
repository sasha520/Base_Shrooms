<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Forest Mushrooms</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0052FF;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #ffffff;
            color: #111111;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; color: #0052FF; }
        button {
            background-color: #0052FF;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px 0;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0038b8; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .stats {
            background: #f4f6f8;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: left;
            font-size: 14px;
        }
        .log {
            margin-top: 15px;
            font-size: 13px;
            color: #555;
            word-break: break-all;
        }
        /* Стили для мини-игры */
        #minigameBox {
            display: none;
            background: #eef2f7;
            padding: 20px;
            border-radius: 15px;
            margin-top: 15px;
            border: 2px dashed #0052FF;
        }
        .mushroom-target {
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            display: inline-block;
            transition: transform 0.1s;
        }
        .mushroom-target:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍄 Грибной Лес Base</h1>
        <p>Собирай грибы, прокачивай корзины и тепловизоры!</p>

        <button id="connectBtn" onclick="connectWallet()">Подключить MetaMask</button>

        <div class="stats" id="statsBox" style="display: none;">
            <p><b>Кошелек:</b> <span id="walletAddress">не подключен</span></p>
            <p><b>Доступ в лес:</b> <span id="accessStatus">❌ Нет</span></p>
            <p><b>Монеты:</b> <span id="playerCoins">0</span> 🪙</p>
            <p><b>Грибов в корзине:</b> <span id="mushroomsInBasket">0</span></p>
        </div>

        <div id="gameControls" style="display: none;">
            <hr>
            <button id="enterForestBtn" onclick="enterForest()" style="background-color: #28a745;">🌲 Купить вход в лес ($0.05)</button>
            
            <div id="activeGameControls" style="display: none;">
                <button onclick="startMiniGame()" style="background-color: #ff8800;">🎮 Идти в лес (Мини-игра)</button>
                <button onclick="sellMushrooms()">💰 Продать грибы</button>
                
                <hr>
                <h3>Магазин</h3>
                <button onclick="buyBasket(1)">🛒 Купить малую корзину (50 монет)</button>
                <button onclick="buyBasket(2)">🛒 Купить среднюю корзину (100 монет)</button>
                <button onclick="buyBasket(3)">🛒 Купить огромную корзину (500 монет)</button>
                <button onclick="buyThermal(1)">🔦 Тепловизор 1 (100 монет)</button>
                <button onclick="buyThermal(2)">🔦 Тепловизор 2 (500 монет)</button>
            </div>
        </div>

        <!-- Окно мини-игры -->
        <div id="minigameBox">
            <h3>Собери гриб! (Подряд без ошибок: <span id="streakCount">0</span>/3)</h3>
            <p>Успей кликнуть по грибу за 1 секунду!</p>
            <div id="targetContainer"></div>
        </div>

        <div class="log" id="logBox">Статус: Готов к работе</div>
    </div>

    <script>
        const CONTRACT_ADDRESS = "0xE738440B84d422D62959AcE691A4fbBA3d16e9e3";

        const CONTRACT_ABI = [
            "function players(address) view returns (bool hasAccess, uint256 coins, uint8 basketLevel, uint8 thermalLevel, uint256 mushroomsInBasket)",
            "function enterForest() external payable",
            "function addMushroom(uint256 mushroomValue) external",
            "function sellMushrooms() external",
            "function buyBasket(uint8 level) external",
            "function buyThermal(uint8 level) external"
        ];

        let provider, signer, contract;
        let streak = 0;
        let gameTimer = null;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    const address = await signer.getAddress();

                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    document.getElementById("walletAddress").innerText = address.substring(0, 6) + "..." + address.substring(38);
                    document.getElementById("connectBtn").style.display = "none";
                    document.getElementById("statsBox").style.display = "block";
                    document.getElementById("gameControls").style.display = "block";

                    await updateStats();
                    log("Кошелек успешно подключен!");
                } catch (error) {
                    log("Ошибка подключения: " + error.message);
                }
            } else {
                alert("Установите MetaMask!");
            }
        }

        async function updateStats() {
            try {
                const address = await signer.getAddress();
                const p = await contract.players(address);
                
                document.getElementById("playerCoins").innerText = p.coins.toString();
                document.getElementById("mushroomsInBasket").innerText = p.mushroomsInBasket.toString();
                
                if (p.hasAccess) {
                    document.getElementById("accessStatus").innerText = "✅ Куплен";
                    document.getElementById("enterForestBtn").style.display = "none";
                    document.getElementById("activeGameControls").style.display = "block";
                } else {
                    document.getElementById("accessStatus").innerText = "❌ Нет";
                    document.getElementById("enterForestBtn").style.display = "block";
                    document.getElementById("activeGameControls").style.display = "none";
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function enterForest() {
            try {
                log("Покупка постоянного доступа в лес...");
                const tx = await contract.enterForest({ value: ethers.parseEther("0.00005") });
                await tx.wait();
                log("Доступ в лес успешно куплен!");
                updateStats();
            } catch (error) {
                log("Ошибка: " + (error.reason || error.message));
            }
        }

        // --- МИНИ-ИГРА ---
        async function startMiniGame() {
            streak = 0;
            document.getElementById("streakCount").innerText = streak;
            document.getElementById("minigameBox").style.display = "block";
            nextRound();
        }

        function nextRound() {
            const container = document.getElementById("targetContainer");
            container.innerHTML = '';

            if (streak >= 3) {
                document.getElementById("minigameBox").style.display = "none";
                finishMiniGameSuccess();
                return;
            }

            const mushroom = document.createElement("div");
            mushroom.className = "mushroom-target";
            mushroom.innerText = "🍄";
            mushroom.onclick = () => {
                clearTimeout(gameTimer);
                streak++;
                document.getElementById("streakCount").innerText = streak;
                nextRound();
            };

            container.appendChild(mushroom);

            // Таймер 1 секунда на клик
            gameTimer = setTimeout(() => {
                container.innerHTML = '<p style="color: red;">⏰ Время вышло! Серия сброшена.</p>';
                streak = 0;
                document.getElementById("streakCount").innerText = streak;
                setTimeout(() => { document.getElementById("minigameBox").style.display = "none"; }, 1500);
            }, 1000);
        }

        async function finishMiniGameSuccess() {
            try {
                log("Мини-игра пройдена! Определяем качество гриба...");
                const address = await signer.getAddress();
                const p = await contract.players(address);

                // Расчет цены в зависимости от тепловизора
                let min = 1, max = 3;
                if (p.thermalLevel === 1) { min = 5; max = 15; }
                else if (p.thermalLevel === 2) { min = 50; max = 100; }

                const randomVal = Math.floor(Math.random() * (max - min + 1)) + min;

                log(`Найден гриб стоимостью ${randomVal} монет! Отправляем в блокчейн...`);
                const tx = await contract.addMushroom(randomVal);
                await tx.wait();
                log("Гриб успешно положен в корзину!");
                updateStats();
            } catch (error) {
                log("Ошибка при добавлении гриба: " + (error.reason || error.message));
            }
        }

        async function sellMushrooms() {
            try {
                log("Продажа грибов...");
                const tx = await contract.sellMushrooms();
                await tx.wait();
                log("Грибы проданы! Монеты зачислены.");
                updateStats();
            } catch (error) {
                log("Ошибка: " + (error.reason || error.message));
            }
        }

        async function buyBasket(level) {
            try {
                log(`Покупка корзины уровня ${level}...`);
                const tx = await contract.buyBasket(level);
                await tx.wait();
                log("Корзина куплена!");
                updateStats();
            } catch (error) {
                log("Ошибка: " + (error.reason || error.message));
            }
        }

        async function buyThermal(level) {
            try {
                log(`Покупка тепловизора уровня ${level}...`);
                const tx = await contract.buyThermal(level);
                await tx.wait();
                log("Тепловизор куплен!");
                updateStats();
            } catch (error) {
                log("Ошибка: " + (error.reason || error.message));
            }
        }

        function log(message) {
            document.getElementById("logBox").innerText = "Статус: " + message;
        }
    </script>
</body>
</html>
